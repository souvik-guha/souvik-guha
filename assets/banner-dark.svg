<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Souvik. Finance and operations in Hong Kong, Python and SQL. A trade allocation goes from a 500-share break to matched.">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .alloc { transform-box: fill-box; transform-origin: left center; fill: #3fb950; }
  .chip-wait, .chip-break, .t-40, .t-45 { opacity: 0; }
  .cursor { transform: translateX(250px); }
  @media (prefers-reduced-motion: no-preference) {
    .alloc { animation: grow 9s ease-in-out infinite, tint 9s steps(1) infinite; }
    .chip-wait { animation: wait 9s ease infinite; }
    .chip-break { animation: brk 9s ease infinite; }
    .chip-ok { animation: ok 9s ease infinite; }
    .t-40 { animation: wait 9s ease infinite; }
    .t-45 { animation: brk 9s ease infinite; }
    .t-52 { animation: ok 9s ease infinite; }
    .cursor { animation: move 9s ease-in-out infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  }
  @keyframes grow { 0%,14% { transform: scaleX(0); } 30%,56% { transform: scaleX(.95); } 66%,100% { transform: scaleX(1); } }
  @keyframes tint { 0% { fill: #f85149; } 62% { fill: #3fb950; } 100% { fill: #3fb950; } }
  @keyframes wait { 0%,24% { opacity: 1; } 30%,100% { opacity: 0; } }
  @keyframes brk  { 0%,24% { opacity: 0; } 30%,56% { opacity: 1; } 62%,100% { opacity: 0; } }
  @keyframes ok   { 0%,56% { opacity: 0; } 62%,96% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes move { 0%,24% { transform: translateX(0); } 30%,56% { transform: translateX(110px); } 62%,100% { transform: translateX(250px); } }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
</style>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#21262d"/></pattern>
  <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="320" fill="#0d1117"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
</g>
<rect x=".5" y=".5" width="1199" height="319" rx="16" fill="none" stroke="#30363d"/>

<circle class="pulse" cx="66" cy="78" r="4" fill="#3fb950"/>
<text x="80" y="83" class="mono" font-size="13" letter-spacing="2" fill="#8b949e">HONG KONG · FINANCE &amp; OPERATIONS</text>
<text x="58" y="160" class="sans" font-size="68" font-weight="700" letter-spacing="-2" fill="#e6edf3">Souvik</text>
<text x="60" y="200" class="sans" font-size="20" fill="#8b949e">MSc Finance, CUHK · Python · SQL · Excel</text>

<g transform="translate(640 54)">
  <rect width="500" height="212" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="38" class="mono" font-size="13" fill="#8b949e">T1001 · 0700.HK · BUY</text>
  <g class="mono" font-size="13" text-anchor="end">
    <text class="t-40" x="476" y="38" fill="#8b949e">as of 09:40</text>
    <text class="t-45" x="476" y="38" fill="#8b949e">as of 09:45</text>
    <text class="t-52" x="476" y="38" fill="#8b949e">as of 09:52</text>
  </g>

  <text x="24" y="78" class="sans" font-size="14" fill="#8b949e">Executed</text>
  <text x="476" y="78" class="mono" font-size="14" text-anchor="end" fill="#e6edf3">10,000</text>
  <rect x="24" y="88" width="452" height="10" rx="5" fill="#58a6ff" fill-opacity=".85"/>

  <text x="24" y="126" class="sans" font-size="14" fill="#8b949e">Allocated</text>
  <g class="mono" font-size="14" text-anchor="end">
    <text class="t-40" x="476" y="126" fill="#8b949e">0</text>
    <text class="t-45" x="476" y="126" fill="#f85149">9,500</text>
    <text class="t-52" x="476" y="126" fill="#e6edf3">10,000</text>
  </g>
  <rect x="24" y="136" width="452" height="10" rx="5" fill="#21262d"/>
  <rect class="alloc" x="24" y="136" width="452" height="10" rx="5"/>

  <g class="chip-wait"><rect x="24" y="164" width="176" height="28" rx="14" fill="#d29922" fill-opacity=".14"/><text x="112" y="183" class="mono" font-size="12.5" font-weight="600" text-anchor="middle" fill="#d29922">AWAITING ALLOCATION</text></g>
  <g class="chip-break"><rect x="24" y="164" width="176" height="28" rx="14" fill="#f85149" fill-opacity=".14"/><text x="112" y="183" class="mono" font-size="12.5" font-weight="600" text-anchor="middle" fill="#f85149">BREAK · 500 SHORT</text></g>
  <g class="chip-ok"><rect x="24" y="164" width="176" height="28" rx="14" fill="#3fb950" fill-opacity=".14"/><text x="112" y="183" class="mono" font-size="12.5" font-weight="600" text-anchor="middle" fill="#3fb950">MATCHED</text></g>

  <line x1="226" y1="178" x2="476" y2="178" stroke="#30363d" stroke-width="2"/>
  <circle cx="226" cy="178" r="3" fill="#30363d"/><circle cx="336" cy="178" r="3" fill="#30363d"/><circle cx="476" cy="178" r="3" fill="#30363d"/>
  <g transform="translate(176 0)"><circle class="cursor" cx="50" cy="178" r="6" fill="#58a6ff"/></g>
</g>
</svg>
